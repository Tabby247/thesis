<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

</style>
</head>
<body>
<div id="tf"></div>
<div id="ov">
  <div id="lb">Parametric Architecture</div>
  <div id="tt">Meridian Spire — Extended Pavilion</div>
  <div id="ds">Central spine to sharp spire, sweeping curved glass facades, asymmetrical roof with oval skylight, rectangular rear wing one story stepped down with domed skylight at center.</div>
</div>
<div id="vc">
  <button class="vb ac" data-v="0"><i class="fas fa-arrow-up" style="margin-right:4px;font-size:9px"></i>Front</button>
  <button class="vb" data-v="1"><i class="fas fa-arrow-left" style="margin-right:4px;font-size:9px"></i>Left</button>

  <button class="vb" data-v="4"><i class="fas fa-eye" style="margin-right:4px;font-size:9px"></i>Aerial</button>

<div id="bf"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ══════════════════════════════════════
// Building Dimensions
// ══════════════════════════════════════
const STORY_H = 4;
const FLOORS = 5;
const BASE_H = STORY_H * FLOORS;   // 20m back wall height
const PEAK_H = 30;                  // 30m front peak
const SPIRE_H = 56;                 // 56m spire tip
const HALF_W = 18;                  // 18m half-width at back (36m total)
const TRI_DEPTH = 40;               // 40m triangle depth

// Rectangle extension
const RECT_H = BASE_H - STORY_H;   // 16m, one floor stepped down
const RECT_DEPTH = 22;             // 22m deep
const RECT_Z_BACK = -TRI_DEPTH / 2 - RECT_DEPTH;  // -42
const RECT_Z_FRONT = -TRI_DEPTH / 2;              // -20

// Dome
const DOME_R = 5.5;
const DOME_CX = 0;
const DOME_CY = RECT_H;
const DOME_CZ = (RECT_Z_FRONT + RECT_Z_BACK) / 2; // -31

// Field
const FIELD_R = 62;

// Mesh resolution
const SEG = 50;
const VSEG = 14;
const WSEG = 28;

// Roof height at parameter u (0=back, 1=front peak), with asymmetry
function roofHeight(u, side) {
  return BASE_H + (PEAK_H - BASE_H) * Math.pow(u, 2.0) + side * 2.2 * u;
}

// Facade X coordinate with parametric bulge and wave
function facadeX(u, side) {
  const base = side * HALF_W * (1 - u);
  const bulge = Math.sin(u * Math.PI) * 3.8 * u;
  const wave = Math.sin(u * Math.PI * 3 + (side > 0 ? 0 : 1.6)) * 1.1 * u;
  return base + side * (bulge + wave);
}

// ══════════════════════════════════════
// Renderer
// ══════════════════════════════════════
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ══════════════════════════════════════
// Scene, Camera, Controls
// ══════════════════════════════════════
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc8d4e0, 0.0013);

const camera = new THREE.PerspectiveCamera(
  54, window.innerWidth / window.innerHeight, 0.5, 650
);
camera.position.set(0, 18, 72);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 10, -4);
controls.minDistance = 18;
controls.maxDistance = 180;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.2;

// ══════════════════════════════════════
// Environment Map (PMREMGenerator)
// ══════════════════════════════════════
function buildEnvironmentMap() {
  const envScene = new THREE.Scene();

  // Sky dome
  const skyGeo = new THREE.SphereGeometry(400, 32, 24);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      cTop: { value: new THREE.Color(0x2468a8) },
      cMid: { value: new THREE.Color(0x78aed0) },
      cBot: { value: new THREE.Color(0xc8d4e0) }
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 cTop, cMid, cBot;
      varying vec3 vWorldPos;
      void main() {
        float h = normalize(vWorldPos).y;
        vec3 c = h > 0.0 ? mix(cMid, cTop, h) : mix(cMid, cBot, clamp(-h * 3.0, 0.0, 1.0));
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });
  envScene.add(new THREE.Mesh(skyGeo, skyMat));

  // Sun disc
  const sunDisc = new THREE.Mesh(
    new THREE.SphereGeometry(22, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  sunDisc.position.set(0, 220, 180);
  envScene.add(sunDisc);

  // Sun glow patch
  const glowPatch = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160),
    new THREE.MeshBasicMaterial({ color: 0xeeeeff, transparent: true, opacity: 0.38 })
  );
  glowPatch.position.set(0, 180, 220);
  glowPatch.lookAt(0, 0, 0);
  envScene.add(glowPatch);

  // Simulated city buildings for reflections
  const buildingColors = [0x5c6872, 0x6e7a84, 0x525e68, 0x78848e, 0x48545e, 0x3e4e5e, 0x344450];
  for (let i = 0; i < 55; i++) {
    const angle = (i / 55) * Math.PI * 2;
    const dist = 160 + Math.random() * 90;
    const w = 12 + Math.random() * 28;
    const h = 28 + Math.random() * 85;
    const d = 12 + Math.random() * 28;
    const mat = new THREE.MeshBasicMaterial({
      color: buildingColors[i % buildingColors.length]
    });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
    envScene.add(mesh);
  }

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(900, 900),
    new THREE.MeshBasicMaterial({ color: 0x3a5a2e })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.1;
  envScene.add(ground);

  // Generate PMREM texture
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const envTexture = pmremGenerator.fromScene(envScene, 0, 0.1, 1000).texture;
  pmremGenerator.dispose();
  return envTexture;
}

const envMap = buildEnvironmentMap();
scene.environment = envMap;

// ══════════════════════════════════════
// Materials
// ══════════════════════════════════════
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x82b8cc,
  metalness: 0.1,
  roughness: 0.012,
  envMap: envMap,
  envMapIntensity: 3.2,
  clearcoat: 1.0,
  clearcoatRoughness: 0.004,
  reflectivity: 1.0,
  transparent: true,
  opacity: 0.84,
  side: THREE.DoubleSide,
  depthWrite: true
});

const domeGlassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x90c8e0,
  metalness: 0.08,
  roughness: 0.008,
  envMap: envMap,
  envMapIntensity: 3.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.002,
  reflectivity: 1.0,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide,
  depthWrite: true
});

const spineMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xc8c8c8,
  metalness: 0.92,
  roughness: 0.04,
  envMap: envMap,
  envMapIntensity: 2.8
});

const slabMaterial = new THREE.MeshStandardMaterial({
  color: 0x484848,
  roughness: 0.3,
  metalness: 0.45,
  transparent: true,
  opacity: 0.55,
  side: THREE.DoubleSide
});

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x353535,
  roughness: 0.22,
  metalness: 0.6
});

const mullionMaterial = new THREE.LineBasicMaterial({ color: 0x1e1e1e });
const finMaterial = new THREE.LineBasicMaterial({ color: 0x3a3a3a });
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.55
});

// ══════════════════════════════════════
// Geometry Builders — Triangle Section
// ══════════════════════════════════════

function buildCurvedFacade(side) {
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= SEG; i++) {
    const u = i / SEG;
    const x = facadeX(u, side);
    const z = -TRI_DEPTH / 2 + TRI_DEPTH * u;
    const h = roofHeight(u, side);

    for (let j = 0; j <= VSEG; j++) {
      const v = j / VSEG;
      positions.push(x, v * h, z);
      uvs.push(u, v);
    }
  }

  for (let i = 0; i < SEG; i++) {
    for (let j = 0; j < VSEG; j++) {
      const a = i * (VSEG + 1) + j;
      const b = a + VSEG + 1;
      if (side < 0) {
        indices.push(a, b, b + 1, a, b + 1, a + 1);
      } else {
        indices.push(a, a + 1, b + 1, a, b + 1, b);
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildTriRoof() {
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= SEG; i++) {
    const u = i / SEG;
    const z = -TRI_DEPTH / 2 + TRI_DEPTH * u;
    const xL = facadeX(u, -1);
    const xR = facadeX(u, 1);
    const hL = roofHeight(u, -1);
    const hR = roofHeight(u, 1);

    for (let j = 0; j <= WSEG; j++) {
      const w = j / WSEG;
      positions.push(
        xL + w * (xR - xL),
        hL + w * (hR - hL),
        z
      );
      uvs.push(w, u);
    }
  }

  for (let i = 0; i < SEG; i++) {
    for (let j = 0; j < WSEG; j++) {
      const a = i * (WSEG + 1) + j;
      const b = a + WSEG + 1;
      indices.push(a, b, b + 1, a, b + 1, a + 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildTriFloorSlab(floorHeight, inset) {
  const s = 16;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= s; i++) {
    const u = i / s;
    const xL = facadeX(u, -1) + inset;
    const xR = facadeX(u, 1) - inset;
    const z = -TRI_DEPTH / 2 + TRI_DEPTH * u;

    for (let j = 0; j <= s; j++) {
      const w = j / s;
      positions.push(xL + w * (xR - xL), floorHeight, z);
    }
  }

  for (let i = 0; i < s; i++) {
    for (let j = 0; j < s; j++) {
      const a = i * (s + 1) + j;
      const b = a + s + 1;
      indices.push(a, b, b + 1, a, b + 1, a + 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildTriMullions(side) {
  const mullionPts = [];
  const finPts = [];
  const numVert = 40;

  // Dense vertical mullions
  for (let vi = 0; vi <= numVert; vi++) {
    const u = vi / numVert;
    const x = facadeX(u, side);
    const z = -TRI_DEPTH / 2 + TRI_DEPTH * u;
    const h = roofHeight(u, side);

    for (let j = 0; j < VSEG; j++) {
      const v0 = j / VSEG;
      const v1 = (j + 1) / VSEG;
      mullionPts.push(x, v0 * h, z, x, v1 * h, z);
    }
  }

  // Horizontal lines at each floor
  for (let f = 0; f <= FLOORS; f++) {
    const v = f / FLOORS;
    for (let i = 0; i < SEG; i++) {
      const u0 = i / SEG;
      const u1 = (i + 1) / SEG;
      mullionPts.push(
        facadeX(u0, side), v * roofHeight(u0, side), -TRI_DEPTH / 2 + TRI_DEPTH * u0,
        facadeX(u1, side), v * roofHeight(u1, side), -TRI_DEPTH / 2 + TRI_DEPTH * u1
      );
    }
  }

  // Mid-story horizontal transoms
  for (let f = 0; f < FLOORS; f++) {
    const v = (f + 0.5) / FLOORS;
    for (let i = 0; i < SEG; i++) {
      const u0 = i / SEG;
      const u1 = (i + 1) / SEG;
      mullionPts.push(
        facadeX(u0, side), v * roofHeight(u0, side), -TRI_DEPTH / 2 + TRI_DEPTH * u0,
        facadeX(u1, side), v * roofHeight(u1, side), -TRI_DEPTH / 2 + TRI_DEPTH * u1
      );
    }
  }

  // Parametric horizontal fins on alternate floors
  for (let f = 1; f <= FLOORS; f += 2) {
    const v = f / FLOORS;
    for (let i = 2; i < SEG; i += 3) {
      const u = i / SEG;
      const x = facadeX(u, side);
      const z = -TRI_DEPTH / 2 + TRI_DEPTH * u;
      const y = v * roofHeight(u, side);
      const du = 0.005;
      const nx = facadeX(u + du, side) - facadeX(u - du, side);
      const nz = TRI_DEPTH * 2 * du;
      const len = Math.max(Math.sqrt(nx * nx + nz * nz), 0.001);
      const ox = (-nz / len) * side * 1.3;
      const oz = (nx / len) * side * 1.3;
      finPts.push(x, y, z, x + ox, y, z + oz);
    }
  }

  const mullionGeo = new THREE.BufferGeometry();
  mullionGeo.setAttribute('position', new THREE.Float32BufferAttribute(mullionPts, 3));

  const finGeo = new THREE.BufferGeometry();
  finGeo.setAttribute('position', new THREE.Float32BufferAttribute(finPts, 3));

  return { mullionGeo, finGeo };
}

function buildTriBackMullions() {
  const pts = [];
  const numV = 40;

  // Verticals
  for (let i = 0; i <= numV; i++) {
    const x = -HALF_W + (2 * HALF_W) * (i / numV);
    pts.push(x, 0, RECT_Z_FRONT, x, BASE_H, RECT_Z_FRONT);
  }

  // Floor horizontals
  for (let f = 0; f <= FLOORS; f++) {
    const y = (f / FLOORS) * BASE_H;
    pts.push(-HALF_W, y, RECT_Z_FRONT, HALF_W, y, RECT_Z_FRONT);
  }

  // Mid-story transoms
  for (let f = 0; f < FLOORS; f++) {
    const y = ((f + 0.5) / FLOORS) * BASE_H;
    pts.push(-HALF_W, y, RECT_Z_FRONT, HALF_W, y, RECT_Z_FRONT);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return geo;
}

function buildRidgeEdge(side) {
  const pts = [];
  for (let i = 0; i <= 140; i++) {
    const u = i / 140;
    pts.push(facadeX(u, side), roofHeight(u, side), -TRI_DEPTH / 2 + TRI_DEPTH * u);
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
}

function buildSpireBlade(wBase, dBase, wTip, dTip, height, segments) {
  const positions = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const y = t * height;
    const w = wBase + (wTip - wBase) * t;
    const d = dBase + (dTip - dBase) * t;
    positions.push(-w / 2, y, -d / 2);
    positions.push(w / 2, y, -d / 2);
    positions.push(w / 2, y, d / 2);
    positions.push(-w / 2, y, d / 2);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 4;
    const b = a + 4;
    indices.push(
      a, b, b + 1, a, b + 1, a + 1,
      a + 1, b + 1, b + 2, a + 1, b + 2, a + 2,
      a + 2, b + 2, b + 3, a + 2, b + 3, a + 3,
      a + 3, b + 3, b, a + 3, b, a
    );
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// ══════════════════════════════════════
// Geometry Builders — Rectangle Wing
// ══════════════════════════════════════

function buildRectWallMullions(wallType) {
  const pts = [];
  const numVert = 36;
  const numFloors = 4;

  if (wallType === 'left' || wallType === 'right') {
    const xSign = wallType === 'left' ? -1 : 1;
    const x = xSign * HALF_W;

    // Verticals along depth
    for (let i = 0; i <= numVert; i++) {
      const t = i / numVert;
      const z = RECT_Z_FRONT + t * (RECT_Z_BACK - RECT_Z_FRONT);
      for (let j = 0; j < 8; j++) {
        const v0 = j / 8;
        const v1 = (j + 1) / 8;
        pts.push(x, v0 * RECT_H, z, x, v1 * RECT_H, z);
      }
    }

    // Floor horizontals
    for (let f = 0; f <= numFloors; f++) {
      const y = (f / numFloors) * RECT_H;
      for (let i = 0; i < 20; i++) {
        const t0 = i / 20;
        const t1 = (i + 1) / 20;
        pts.push(
          x, y, RECT_Z_FRONT + t0 * RECT_DEPTH,
          x, y, RECT_Z_FRONT + t1 * RECT_DEPTH
        );
      }
    }

    // Mid-story transoms
    for (let f = 0; f < numFloors; f++) {
      const y = ((f + 0.5) / numFloors) * RECT_H;
      for (let i = 0; i < 20; i++) {
        const t0 = i / 20;
        const t1 = (i + 1) / 20;
        pts.push(
          x, y, RECT_Z_FRONT + t0 * RECT_DEPTH,
          x, y, RECT_Z_FRONT + t1 * RECT_DEPTH
        );
      }
    }
  } else {
    // Back wall
    for (let i = 0; i <= numVert; i++) {
      const x = -HALF_W + (2 * HALF_W) * (i / numVert);
      for (let j = 0; j < 8; j++) {
        const v0 = j / 8;
        const v1 = (j + 1) / 8;
        pts.push(x, v0 * RECT_H, RECT_Z_BACK, x, v1 * RECT_H, RECT_Z_BACK);
      }
    }

    for (let f = 0; f <= numFloors; f++) {
      const y = (f / numFloors) * RECT_H;
      for (let i = 0; i < 20; i++) {
        const t0 = i / 20;
        const t1 = (i + 1) / 20;
        pts.push(
          -HALF_W + t0 * 2 * HALF_W, y, RECT_Z_BACK,
          -HALF_W + t1 * 2 * HALF_W, y, RECT_Z_BACK
        );
      }
    }

    for (let f = 0; f < numFloors; f++) {
      const y = ((f + 0.5) / numFloors) * RECT_H;
      for (let i = 0; i < 20; i++) {
        const t0 = i / 20;
        const t1 = (i + 1) / 20;
        pts.push(
          -HALF_W + t0 * 2 * HALF_W, y, RECT_Z_BACK,
          -HALF_W + t1 * 2 * HALF_W, y, RECT_Z_BACK
        );
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return geo;
}

function buildDomeFrame() {
  const pts = [];
  const numMeridians = 16;
  const numParallels = 6;
  const numArcSeg = 20;

  // Meridian ribs
  for (let i = 0; i < numMeridians; i++) {
    const theta = (i / numMeridians) * Math.PI * 2;
    for (let j = 0; j < numArcSeg; j++) {
      const phi0 = (j / numArcSeg) * Math.PI / 2;
      const phi1 = ((j + 1) / numArcSeg) * Math.PI / 2;
      const r0 = DOME_R * Math.cos(phi0);
      const r1 = DOME_R * Math.cos(phi1);
      pts.push(
        DOME_CX + r0 * Math.cos(theta), DOME_CY + DOME_R * Math.sin(phi0), DOME_CZ + r0 * Math.sin(theta),
        DOME_CX + r1 * Math.cos(theta), DOME_CY + DOME_R * Math.sin(phi1), DOME_CZ + r1 * Math.sin(theta)
      );
    }
  }

  // Parallel rings
  for (let j = 1; j < numParallels; j++) {
    const phi = (j / numParallels) * Math.PI / 2;
    const cr = DOME_R * Math.cos(phi);
    const cy = DOME_CY + DOME_R * Math.sin(phi);
    for (let i = 0; i < 24; i++) {
      const t0 = (i / 24) * Math.PI * 2;
      const t1 = ((i + 1) / 24) * Math.PI * 2;
      pts.push(
        DOME_CX + cr * Math.cos(t0), cy, DOME_CZ + cr * Math.sin(t0),
        DOME_CX + cr * Math.cos(t1), cy, DOME_CZ + cr * Math.sin(t1)
      );
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return geo;
}

building.add(intLight2);

const intLight3 = new THREE.PointLight(0xffe8c0, 1.8, 30);
intLight3.position.set(0, 8, DOME_CZ);
building.add(intLight3);

// ══════════════════════════════════════
// Camera Presets
// ══════════════════════════════════════
const viewPresets = [
  { pos: [0, 18, 72], target: [0, 12, -2] },     // Front
  { pos: [-64, 18, 8], target: [0, 12, -4] },     // Left
  { pos: [64, 18, 8], target: [0, 12, -4] },      // Right
  { pos: [46, 24, 56], target: [0, 10, -6] },     // 3/4
  { pos: [10, 78, 22], target: [0, 0, -4] },      // Aerial
  { pos: [0, 16, -72], target: [0, 14, DOME_CZ] } // Rear (shows dome)
];

let cameraAnimation = null;

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

document.querySelectorAll('.vb').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const preset = viewPresets[parseInt(btn.dataset.v)];
    document.querySelectorAll('.vb').forEach(function(b) {
      b.classList.remove('ac');
    });
    btn.classList.add('ac');
    controls.autoRotate = false;
    cameraAnimation = {
      startPos: camera.position.clone(),
      startTarget: controls.target.clone(),
      endPos: new THREE.Vector3(preset.pos[0], preset.pos[1], preset.pos[2]),
      endTarget: new THREE.Vector3(preset.target[0], preset.target[1], preset.target[2]),
      startTime: performance.now(),
      duration: 1500
    };
  });
});

// ══════════════════════════════════════
// Animation Loop
// ══════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);

  if (cameraAnimation) {
    const elapsed = performance.now() - cameraAnimation.startTime;
    const t = Math.min(elapsed / cameraAnimation.duration, 1);
    const e = easeInOutCubic(t);

    camera.position.lerpVectors(cameraAnimation.startPos, cameraAnimation.endPos, e);
    controls.target.lerpVectors(cameraAnimation.startTarget, cameraAnimation.endTarget, e);

    if (t >= 1) {
      cameraAnimation = null;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ══════════════════════════════════════
// Resize Handler
// ══════════════════════════════════════
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
